name: Build Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSI
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_path: apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            artifact_path: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            artifact_path: apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage pinned Windows skin runtime
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./apps/desktop/scripts/stage-windows-node.ps1

      - name: Install macOS target
        if: matrix.platform == 'macos-latest'
        run: rustup target add ${{ matrix.target }}

      - name: Build Tauri app
        run: pnpm --dir apps/desktop build -- --target ${{ matrix.target }}

      - name: Repair unsigned macOS app bundle signature
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          dmg_dir="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          dmg="$(find "$dmg_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          ./apps/desktop/scripts/repack-adhoc-macos-dmg.sh "$dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DevConduit-package-${{ matrix.platform }}-${{ matrix.target }}
          path: ${{ matrix.artifact_path }}
