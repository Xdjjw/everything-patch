name: Release Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, for example v0.4.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Validate version and prepare release notes
        id: metadata
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $REQUESTED_TAG" >&2
            exit 1
          fi
          git rev-parse --quiet --verify "refs/tags/${REQUESTED_TAG}^{commit}" >/dev/null

          RELEASE_TAG="$REQUESTED_TAG" python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          expected = tag[1:]
          root_package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          desktop_package = json.loads(Path("apps/desktop/package.json").read_text(encoding="utf-8"))
          tauri_config = json.loads(Path("apps/desktop/src-tauri/tauri.conf.json").read_text(encoding="utf-8"))
          cargo_text = Path("apps/desktop/src-tauri/Cargo.toml").read_text(encoding="utf-8")
          cargo_match = re.search(
              r'^\[package\]\s*$.*?^version\s*=\s*"([^"]+)"',
              cargo_text,
              flags=re.S | re.M,
          )
          if not cargo_match:
              raise SystemExit("Unable to read the package version from Cargo.toml")

          versions = {
              "package.json": root_package.get("version"),
              "apps/desktop/package.json": desktop_package.get("version"),
              "apps/desktop/src-tauri/Cargo.toml": cargo_match.group(1),
              "apps/desktop/src-tauri/tauri.conf.json": tauri_config.get("version"),
          }
          mismatches = {path: value for path, value in versions.items() if value != expected}
          if mismatches:
              details = ", ".join(f"{path}={value!r}" for path, value in mismatches.items())
              raise SystemExit(f"Release tag {tag} does not match project versions: {details}")

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(tag)}\].*?\n(.*?)(?=^## \[|\Z)",
              changelog,
              flags=re.S | re.M,
          )
          body = match.group(1).strip() if match else ""
          if not body:
              body = "DevConduit desktop release."
          Path("release-body.md").write_text(body + "\n", encoding="utf-8")
          PY

          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$is_draft" != "true" ]; then
              echo "${RELEASE_TAG} is already published; create a new version instead." >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" \
              --draft \
              --title "DevConduit ${RELEASE_TAG}" \
              --notes-file release-body.md
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --title "DevConduit ${RELEASE_TAG}" \
              --notes-file release-body.md
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSI
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_dir: apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi
            artifact_glob: '*.msi'
            release_asset_suffix: x64.msi
          - name: macOS Apple Silicon DMG
            platform: macos-latest
            target: aarch64-apple-darwin
            artifact_dir: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
            artifact_glob: '*.dmg'
            release_asset_suffix: aarch64.dmg
          - name: macOS Intel DMG
            platform: macos-latest
            target: x86_64-apple-darwin
            artifact_dir: apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg
            artifact_glob: '*.dmg'
            release_asset_suffix: x64.dmg

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage pinned Windows skin runtime
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./apps/desktop/scripts/stage-windows-node.ps1

      - name: Install macOS target
        if: matrix.platform == 'macos-latest'
        run: rustup target add ${{ matrix.target }}

      - name: Build installer
        run: pnpm --dir apps/desktop build -- --target ${{ matrix.target }}

      - name: Repair unsigned macOS app bundle signature
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find "${{ matrix.artifact_dir }}" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          ./apps/desktop/scripts/repack-adhoc-macos-dmg.sh "$dmg"

      - name: Upload installer to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          asset_count=0
          while IFS= read -r -d '' asset; do
            release_version="${RELEASE_TAG#v}"
            release_asset="${{ matrix.artifact_dir }}/DevConduit_${release_version}_${{ matrix.release_asset_suffix }}"
            if [ "$asset" != "$release_asset" ]; then
              mv "$asset" "$release_asset"
            fi
            gh release upload "$RELEASE_TAG" "$release_asset" --clobber
            asset_count=$((asset_count + 1))
          done < <(find "${{ matrix.artifact_dir }}" -maxdepth 1 -type f -name "${{ matrix.artifact_glob }}" -print0)

          if [ "$asset_count" -ne 1 ]; then
            echo "Expected one installer matching ${{ matrix.artifact_glob }} in ${{ matrix.artifact_dir }}, found $asset_count." >&2
            exit 1
          fi

  publish:
    name: Publish release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
